name: Google Play Internal Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Android version name'
        required: true
        default: '1.0.0'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/release/internal-trigger.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-play-internal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PACKAGE_NAME: pl.sundreamsoftware.poopclicker
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Authenticate to Google Play
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Verify Google Play API access and create edit
        id: play-edit
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          RESPONSE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error \
            -o "$RESPONSE" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits")"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Google Play edits.insert failed with HTTP $HTTP_CODE"
            cat "$RESPONSE"
            exit 1
          fi

          EDIT_ID="$(jq -r '.id' "$RESPONSE")"
          test -n "$EDIT_ID" && test "$EDIT_ID" != "null" || { echo "::error::Google Play returned no edit id"; cat "$RESPONSE"; exit 1; }
          echo "edit_id=$EDIT_ID" >> "$GITHUB_OUTPUT"
          echo "Google Play API access verified."

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build web bundle
        env:
          VITE_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          VITE_ADMOB_BANNER_ID: ${{ secrets.VITE_ADMOB_BANNER_ID }}
          VITE_ADMOB_INTERSTITIAL_ID: ${{ secrets.VITE_ADMOB_INTERSTITIAL_ID }}
          VITE_ADMOB_REWARDED_ID: ${{ secrets.VITE_ADMOB_REWARDED_ID }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore Firebase configuration if present
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set; skipping Firebase configuration."
          fi

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Build signed AAB
        working-directory: android
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME" \
            -PADMOB_APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}" \
            -Pandroid.injected.signing.store.file="$(pwd)/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload AAB to Internal testing
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          EDIT_ID: ${{ steps.play-edit.outputs.edit_id }}
        run: |
          set -euo pipefail
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$AAB" || { echo "::error::Release AAB not found"; exit 1; }

          RESPONSE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error \
            -o "$RESPONSE" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@$AAB" \
            "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$EDIT_ID/bundles?uploadType=media")"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Google Play bundle upload failed with HTTP $HTTP_CODE"
            cat "$RESPONSE"
            exit 1
          fi

          VERSION_CODE_UPLOADED="$(jq -r '.versionCode' "$RESPONSE")"
          test -n "$VERSION_CODE_UPLOADED" && test "$VERSION_CODE_UPLOADED" != "null" || { echo "::error::Google Play returned no versionCode"; cat "$RESPONSE"; exit 1; }

          jq -n \
            --arg track internal \
            --arg name "PoopClicker $VERSION_NAME" \
            --arg vc "$VERSION_CODE_UPLOADED" \
            '{track:$track,releases:[{name:$name,versionCodes:[$vc],status:"completed"}]}' \
            > /tmp/internal-track.json

          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/internal-track.json \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$EDIT_ID/tracks/internal" >/dev/null

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$EDIT_ID:commit" >/dev/null

          echo "Published versionCode=$VERSION_CODE_UPLOADED to Google Play internal track"

      - name: Delete uncommitted Google Play edit on failure
        if: failure()
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          EDIT_ID: ${{ steps.play-edit.outputs.edit_id }}
        run: |
          if [ -n "${EDIT_ID:-}" ] && [ -n "${ACCESS_TOKEN:-}" ]; then
            curl --silent --show-error \
              -X DELETE \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$EDIT_ID" >/dev/null || true
          fi

      - name: Upload AAB only on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PoopClicker-internal-failed-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 3
