name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Gradle task (assembleRelease or bundleRelease)'
        required: true
        default: 'bundleRelease'
        type: choice
        options:
          - bundleRelease
          - assembleRelease
      production:
        description: 'Require production ads/Firebase/signing configuration'
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate production configuration
        if: ${{ inputs.production }}
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          VITE_ADMOB_INTERSTITIAL_ID: ${{ secrets.VITE_ADMOB_INTERSTITIAL_ID }}
          VITE_ADMOB_REWARDED_ID: ${{ secrets.VITE_ADMOB_REWARDED_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$ADMOB_APP_ID" || { echo "::error::ADMOB_APP_ID is required"; exit 1; }
          test -n "$VITE_ADMOB_INTERSTITIAL_ID" || { echo "::error::VITE_ADMOB_INTERSTITIAL_ID is required"; exit 1; }
          test -n "$VITE_ADMOB_REWARDED_ID" || { echo "::error::VITE_ADMOB_REWARDED_ID is required"; exit 1; }
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is required"; exit 1; }
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "::error::GOOGLE_SERVICES_JSON_BASE64 is required"; exit 1; }

      - name: Build web
        env:
          VITE_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          VITE_ADMOB_BANNER_ID: ${{ secrets.VITE_ADMOB_BANNER_ID }}
          VITE_ADMOB_INTERSTITIAL_ID: ${{ secrets.VITE_ADMOB_INTERSTITIAL_ID }}
          VITE_ADMOB_REWARDED_ID: ${{ secrets.VITE_ADMOB_REWARDED_ID }}
        run: npm run build

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || \
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Capacitor sync Android
        run: npx cap sync android

      - name: Decode Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          fi

      - name: Decode keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
            echo "KEYSTORE_PRESENT=true" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PRESENT=false" >> "$GITHUB_ENV"
            echo "No ANDROID_KEYSTORE_BASE64 secret — building unsigned/debug-signed release artifact."
          fi

      - name: Assemble release
        working-directory: android
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          TASK="${{ inputs.build_type }}"
          if [ "$KEYSTORE_PRESENT" = "true" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            ./gradlew "$TASK" --no-daemon -PADMOB_APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}" \
              -Pandroid.injected.signing.store.file="$(pwd)/release.keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="${ANDROID_KEY_ALIAS:-upload}" \
              -Pandroid.injected.signing.key.password="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          else
            # Unsigned / default debug-signed release build — does not publish to Play.
            ./gradlew "$TASK" --no-daemon -PADMOB_APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}" || \
              ./gradlew assembleRelease --no-daemon -PADMOB_APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          fi

      - name: Upload AAB/APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PoopClicker-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
